<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f2eb">
    <title>Find your next event | Gather</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script type="module" src="./js/pages/home.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="Gather home">gather<span>.</span></a>
      <nav aria-label="Main navigation">
        <a href="./index.html" aria-current="page">Explore</a>
      </nav>
    </header>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Good things happen together</p>
        <h1 id="page-title">Find your next<br>great experience.</h1>
        <p class="hero-copy">Live music, bright ideas, and little reasons to get out.</p>
      </section>
      <section class="content-section" aria-labelledby="events-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Made for your calendar</p>
            <h2 id="events-heading">Explore events</h2>
          </div>
        </div>
        <form class="filters" id="event-filters">
          <div class="field field-search">
            <label for="search">Search events</label>
            <input id="search" name="q" type="search" placeholder="Artist, event or venue">
          </div>
          <div class="field">
            <label for="city">City</label>
            <select id="city" name="city">
              <option value="">All cities</option>
            </select>
          </div>
          <div class="field">
            <label for="max-price">Maximum price (₦)</label>
            <input id="max-price" name="maxPrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Any price">
          </div>
          <div class="field">
            <label for="sort-by">Sort by</label>
            <select id="sort-by" name="sortBy">
              <option value="date">Soonest</option>
              <option value="price">Price: low to high</option>
              <option value="availability">Most tickets</option>
            </select>
          </div>
          <div class="filter-actions">
            <button class="button button-primary" type="submit">Find events</button>
            <button class="button button-quiet" type="reset">Clear</button>
          </div>
        </form>
        <p class="result-count" id="result-count" role="status" aria-live="polite"></p>
        <div class="event-grid" id="event-list" aria-busy="true"></div>
      </section>
    </main>
    <footer class="site-footer">
      <a class="brand" href="./index.html">gather<span>.</span></a>
      <p>Make room for a good time.</p>
    </footer>
  </body>
</html>
